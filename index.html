
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>TaskFlow</h2>
    <p>Organize your work. Achieve your goals.</p>
</header>

<main class="container">
    <section class="welcome">
        <h1>My Tasks</h1>
        <p>Manage your daily activities in one place.</p>
    </section>

    <section class="stats">
        <div class="stat">
            <h2 id="total">0</h2>
            <p>Total Tasks</p>
        </div>
        <div class="stat">
            <h2 id="pending">0</h2>
            <p>Pending</p>
        </div>
        <div class="stat">
            <h2 id="completed">0</h2>
            <p>Completed</p>
        </div>
    </section>

    <section class="task-form">
        <h2>Add New Task</h2>
        <form id="taskForm">
            <input type="text" id="taskTitle"
                   placeholder="Enter task title..." required>

            <textarea id="taskDescription"
                      placeholder="Task description (optional)"></textarea>

            <div class="form-row">
                <select id="priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>

                <input type="date" id="dueDate">
            </div>

            <button type="submit" class="add-btn">+ Add Task</button>
        </form>
    </section>

    <section class="task-list">
        <div class="list-heading">
            <h2>My Task List</h2>
            <select id="filter">
                <option value="All">All Tasks</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div id="tasksContainer"></div>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </section>
</main>

<footer>
    <p>© 2026 TaskFlow | Task Management System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
